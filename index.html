<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridiron Legends — Play Feed</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0A1530; --deck: #101D3E; --rule: #22335F; --ink: #EEF2FF; --mute: #8C9AC4;
  --gold: #FFC81F; --turf: #3DD68C; --flag: #FF5468; --score: #FF2E3E;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--navy); color: var(--ink); font: 400 15px/1.45 var(--body); }
body { padding-bottom: env(safe-area-inset-bottom, 0px); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }
.top { position: sticky; top: 0; z-index: 10; background: var(--navy); border-bottom: 1px solid var(--rule); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { font: 800 22px/1 var(--cond); letter-spacing: .5px; }
.brand b { color: var(--gold); font-weight: 800; }
.back { font: 600 15px var(--body); color: var(--mute); }
.back:hover { color: var(--ink); }

/* games grid */
.games h1 { font: 800 40px/1 var(--cond); margin: 28px 0 4px; }
.games p.sub { color: var(--mute); margin: 0 0 18px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.gcard { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--deck); }
.gcard:hover { border-color: var(--mute); }
.gcard.is-live { border-color: var(--flag); }
.trow { display: grid; grid-template-columns: 30px auto 1fr; align-items: center; gap: 10px; }
.trow .s { font: 800 26px/1 var(--cond); min-width: 30px; }
.trow .n { font: 500 12px var(--body); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.lose .s { color: var(--mute); }
.trow.lose .n { color: #6E7BA6; }
.state { grid-column: 2; grid-row: 1 / span 2; text-align: right; display: flex; flex-direction: column; justify-content: center; gap: 3px; font: 700 15px/1.1 var(--cond); }
.state .v, .state .x { font: 600 12px var(--body); color: var(--mute); }
.state .x b { color: var(--gold); font: 800 15px var(--cond); }
.state .live { color: var(--flag); }
.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); margin-right: 5px; vertical-align: middle; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.mtag { font: 600 10px var(--body); color: var(--gold); }
.badge { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 800 12px var(--cond); flex: none; border: 2px solid rgba(255,255,255,.25); }
.badge.xs { width: 28px; height: 28px; font-size: 10px; }
.badge.lg { width: 52px; height: 52px; font-size: 16px; }
.badge.sm { width: 22px; height: 22px; font-size: 9px; border-width: 1px; }
a:hover > .badge { border-color: var(--gold); }

/* scoreboard */
.board { padding: 18px 0 10px; }
.board .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.board .team { display: flex; align-items: center; gap: 12px; }
.board .team.r { flex-direction: row-reverse; text-align: right; }
.board .pts { font: 800 56px/1 var(--cond); }
.board .city { font: 500 13px var(--body); color: var(--mute); }
.board .clock { text-align: center; font: 700 20px/1.1 var(--cond); }
.board .clock .dd { display: block; font: 600 14px var(--body); color: var(--gold); margin-top: 4px; }
.poss { color: var(--gold); font-size: 14px; margin: 0 4px; }
.field { position: relative; height: 26px; margin: 16px 0 4px; border-radius: 4px; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--rule) calc(10% - 1px) 10%), #0E2246; overflow: hidden; }
.field .ez { position: absolute; top: 0; bottom: 0; width: 6%; opacity: .55; }
.field .drive { position: absolute; top: 9px; height: 8px; background: var(--gold); border-radius: 4px; transition: left .5s, width .5s; }
.field .ball { position: absolute; top: 5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #8B4A1E; border: 2px solid #F3E2C7; transition: left .5s; }
.field .fd { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: var(--gold); box-shadow: 0 0 6px var(--gold); transition: left .5s; }
.yards { display: flex; justify-content: space-between; font: 600 11px var(--cond); color: var(--mute); padding: 0 1%; }
.tabs { display: flex; border-bottom: 1px solid var(--rule); margin-top: 6px; overflow-x: auto; }
.tabs a { flex: 1; text-align: center; padding: 12px 10px; font: 700 16px var(--cond); color: var(--mute); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--ink); border-color: var(--gold); }
.tabs.sub a { font-size: 15px; padding: 9px; }

/* feed */
.play { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--rule); }
.play .meta { font: 500 13px var(--body); color: var(--mute); display: flex; gap: 10px; flex-wrap: wrap; }
.play h3 { margin: 2px 0 2px; font: 800 22px/1.1 var(--cond); }
.play h3.sc { color: var(--score); }
.play h3.to { color: var(--flag); }
.play .who { font: 600 14px var(--body); }
.play .who span, .play .who2 span { color: var(--mute); font-weight: 500; }
.play .who2 { font: 500 13px var(--body); color: var(--mute); }
.play .try { font: 600 13px var(--body); margin-top: 3px; }
.play .who a:hover, .play .who2 a:hover { text-decoration: underline; }
.val { font: 800 18px var(--cond); align-self: start; padding-top: 2px; min-width: 52px; text-align: right; }
.pos { color: var(--turf); } .neg { color: var(--flag); } .zero { color: var(--mute); }

/* game tab */
h2 { font: 800 22px/1 var(--cond); margin: 24px 0 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 600 12px var(--body); color: var(--mute); padding: 8px 6px; border-bottom: 1px solid var(--rule); }
td { padding: 10px 6px; border-bottom: 1px solid var(--rule); }
td.n, th.n { text-align: center; font-family: var(--cond); font-size: 18px; font-weight: 700; }
.scroll { overflow-x: auto; }
.leads { display: flex; gap: 22px; flex-wrap: wrap; font: 600 14px var(--body); color: var(--mute); align-items: center; }
.leads b { color: var(--ink); font: 800 20px var(--cond); margin: 0 4px 0 6px; }
.h2h .r { display: grid; grid-template-columns: 70px 1fr 70px; align-items: end; padding: 9px 0 0; }
.h2h .r .l, .h2h .r .rv { font: 800 18px/1 var(--cond); }
.h2h .r .rv { text-align: right; }
.h2h .r .lbl { text-align: center; font: 500 13px var(--body); color: var(--mute); }
.h2h .bar { display: flex; height: 6px; margin: 6px 0 4px; border-radius: 3px; overflow: hidden; background: var(--rule); }
.h2h .bar i { display: block; height: 6px; }
.h2h .bar i + i { border-left: 2px solid var(--navy); }
.h2h .heads { display: flex; justify-content: space-between; margin-bottom: 4px; }

/* team pages */
.teamhead { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 16px 0 12px; border-bottom: 1px solid var(--rule); }
.teamhead .nm { font: 800 22px/1 var(--cond); }
.teamhead .nm small { font: 700 16px var(--cond); margin-left: 8px; }
.strip { display: flex; gap: 18px; overflow-x: auto; padding: 8px 0 2px; }
.strip div { flex: none; font: 800 19px/1 var(--cond); }
.strip div small { display: block; font: 600 10px var(--body); color: var(--mute); margin-top: 3px; }
.prow { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.prow .badge { width: 44px; height: 44px; font-size: 14px; }
.prow .nm { font: 600 14px var(--body); }
.prow .nm span { color: var(--mute); font-weight: 500; }
.prow .nm em { font-style: normal; font-weight: 700; margin-left: 4px; }
.you { font: 600 10px var(--body); color: var(--gold); border: 1px solid var(--gold); border-radius: 8px; padding: 0 5px; margin-left: 6px; }

/* performances */
.avstrip { display: flex; gap: 10px; overflow-x: auto; padding: 14px 2px 6px; }
.av { position: relative; flex: none; }
.av .badge { width: 46px; height: 46px; font-size: 14px; }
.av.on .badge { outline: 3px solid var(--gold); outline-offset: 2px; }
.av.team .badge { border-radius: 12px; }
.av em { position: absolute; top: -6px; right: -8px; font: 700 11px var(--cond); font-style: normal; background: var(--navy); border: 1px solid var(--rule); border-radius: 9px; padding: 0 5px; }
.avsep { flex: none; width: 1px; background: var(--rule); margin: 4px 2px; }
.hero { display: flex; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.hero .nm { font: 600 15px var(--body); color: var(--mute); }
.hero .big { font: 800 40px/1 var(--cond); }
.hero .big small { font: 600 16px var(--body); color: var(--mute); margin: 0 10px 0 3px; }
.hero .rt { margin-left: auto; text-align: right; font: 800 34px/1 var(--cond); }
.hero .rt small { display: block; font: 600 12px var(--body); color: var(--mute); margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 14px 10px; padding: 14px 0; }
.grid div { font: 800 22px/1 var(--cond); }
.grid div small { display: block; font: 600 11px var(--body); color: var(--mute); margin-top: 3px; }
svg.chart { width: 100%; height: 190px; display: block; }
.empty { color: var(--mute); padding: 40px 4px; text-align: center; }
.empty strong { display: block; color: var(--ink); font: 700 22px var(--cond); margin-bottom: 6px; }
.filter { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
.filter button { font: 600 13px var(--body); color: var(--mute); border: 1px solid var(--rule); border-radius: 16px; padding: 4px 12px; }
.filter button.on { color: var(--navy); background: var(--gold); border-color: var(--gold); }
@media (max-width: 560px) {
  .board .pts { font-size: 42px; } .badge.lg { width: 40px; height: 40px; font-size: 13px; }
  .play h3 { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="wrap" id="topbar"><a class="brand" href="#/">Gridiron <b>Legends</b></a></div></header>
<main class="wrap" id="app"><div class="empty">Loading…</div></main>

<script type="module">
// ============ SETUP: paste your Firebase Realtime Database URL ============
const DB_URL = "https://gridiron-feed-default-rtdb.firebaseio.com/";
// ==========================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, off, query, orderByChild, limitToLast, get, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = document.getElementById("app"), topbar = document.getElementById("topbar");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ORD = ["", "1st", "2nd", "3rd", "4th"];
const qName = q => q >= 6 ? "2OT" : q >= 5 ? "OT" : "Q" + q;
const qWord = q => q >= 6 ? "2OT" : q >= 5 ? "OT" : ORD[q];
const sign = v => (v > 0.005 ? "+" : v < -0.005 ? "−" : "") + Math.abs(v).toFixed(1);
const one = v => (Math.round(v * 10) / 10).toFixed(1);
const cls = v => v > 0.005 ? "pos" : v < -0.005 ? "neg" : "zero";
const whole = t => String(t ?? "").replace(/-?\d+\.\d+/g, m => Math.round(+m));
const initials = n => String(n || "?").replace(/[^A-Za-z0-9 .]/g, "").split(/[ .]+/).filter(Boolean).slice(-2).map(w => w[0]).join("").toUpperCase() || "?";
const badge = (t, size = "") => t ? `<span class="badge ${size}" style="background:${esc(t.color)};color:${esc(t.color2)}">${esc(t.abbr)}</span>` : "";
const avatar = (name, t) => `<span class="badge" style="background:${esc(t?.color)};color:${esc(t?.color2)}">${esc(initials(name))}</span>`;
const posOf = p => p ? (p.unit === "Def" ? p.def : p.unit === "ST" ? "K/P" : p.slot === "QB" ? "QB" : p.slot === "RB" ? "RB" : (p.slot || "").startsWith("WR") ? "WR" : (p.slot === "LG" || p.slot === "RG") ? "OL" : p.slot) : "";
const secs = c => { const [m, s] = String(c || "0:00").split(":").map(Number); return (m || 0) * 60 + (s || 0); };
const mmss = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const avg = (a, b) => b ? (a / b).toFixed(1) : "0.0";
const STALE = 20 * 60;
const isLive = x => !!x && x.status === "live" && !(x.updatedAt && Date.now() / 1000 - x.updatedAt > STALE);
const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "m" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n || 0);
const passerRating = (c, a, y, td, i) => { if (!a) return 0; const k = x => Math.min(2.375, Math.max(0, x));
  return (k((c / a - .3) * 5) + k((y / a - 3) * .25) + k(td / a * 20) + k(2.375 - i / a * 25)) / 6 * 100; };

if (DB_URL.includes("YOUR-PROJECT")) {
  app.innerHTML = `<div class="empty"><strong>Connect your database</strong>Open index.html and set DB_URL to your Firebase Realtime Database URL. The README walks through it.</div>`;
  throw new Error("DB_URL not set");
}
const db = getDatabase(initializeApp({ databaseURL: DB_URL }));
let subs = [];
function listen(r, cb) { onValue(r, s => cb(s.val())); subs.push(() => off(r)); }
function stopAll() { subs.forEach(f => f()); subs = []; }

// =================== play descriptions, boosts, excitement ===================
const BOOST = { "game-winning": 1.0, "lead-taking": 0.5, "game-tying": 0.5, "beast mode": 0.6, "rip": 0.3, "wide-open": 0.15 };
// score words come from the score before/after each play; "game-winning" = the last time the winner took the lead in a final
function tagPlays(asc, meta) {
  const tags = {}; let ph = 0, pa = 0; const lastLead = {};
  for (const p of asc) {
    const tg = {};
    const bh = p.preHome ?? ph, ba = p.preAway ?? pa, h = p.homeScore ?? bh, a = p.awayScore ?? ba;
    if (h !== bh || a !== ba) {
      const scorer = h - bh > a - ba ? "Home" : "Away", mine = scorer === "Home" ? 1 : -1;
      const before = Math.sign(bh - ba), after = Math.sign(h - a);
      tg.scorer = scorer;
      if (after === 0 && before !== 0) tg.score = "game-tying";
      else if (after === mine && before !== mine) { tg.score = "lead-taking"; lastLead[scorer] = p.n; }
    }
    if (p.rush && !p.td && p.gain >= 40) tg.style = "beast mode";
    else if (p.rush && !p.td && p.gain >= 20) tg.style = "rip";
    else if (p.wideOpen) tg.style = "wide-open";
    tags[p.n] = tg; ph = h; pa = a;
  }
  if (!isLive(meta) && meta.homeScore !== meta.awayScore) {
    const n = lastLead[meta.homeScore > meta.awayScore ? "Home" : "Away"];
    if (n != null) tags[n].score = "game-winning";
  }
  return tags;
}
function describe(p, tg) {
  let t = whole(p.title);
  if (p.kind === "fgmiss") t = t.replace(/ missed$/, " attempt");
  const words = [tg?.score, tg?.style].filter(Boolean);
  if (!words.length) return t;
  const m = t.match(/^(\d+-yd )(.*)$/);
  if (!m) return t;
  let rest = m[2];
  if (tg.style === "rip" || tg.style === "beast mode") rest = rest.replace(/^rush$/, "run");
  return m[1] + words.join(" ") + " " + rest;
}
const boostOf = tg => (BOOST[tg?.score] || 0) + (BOOST[tg?.style] || 0);
// play value shown in the feed: change in expected points + a boost for big moments (for the team that made them)
function shownValue(p, tg) { if (p.call === "Kneel" || p.title === "Kneel") return 0; // kneeling out the clock is neutral
  const b = boostOf(tg); return (p.value || 0) + (p.turnover ? -b : b); }

// how eventful was the game? (out of 10, shown once it's final)
function excitement(asc, m) {
  if (!asc.length) return null;
  let changes = 0, leader = 0, ties = 0, big = 0, late = false, worst = 0;
  const finalDiff = (m.homeScore || 0) - (m.awayScore || 0), w = Math.sign(finalDiff);
  const tags = tagPlays(asc, m);
  for (const p of asc) {
    const d = (p.homeScore ?? 0) - (p.awayScore ?? 0), s = Math.sign(d);
    if (s !== 0 && leader !== 0 && s !== leader) changes++;
    if (s !== 0) leader = s;
    const tg = tags[p.n];
    if (tg.score === "game-tying") ties++;
    if (Math.abs(p.value || 0) >= 2.5) big++;
    if (tg.score && (p.q >= 5 || (p.q === 4 && secs(p.clock) <= 120))) late = true;
    if (w !== 0) worst = Math.min(worst, d * w);
  }
  const margin = Math.abs(finalDiff), pts = (m.homeScore || 0) + (m.awayScore || 0), ot = asc.some(p => p.q >= 5);
  const score = 2.2 + Math.min(3, changes * 0.9) + Math.min(1, ties * 0.4) + (margin <= 3 ? 2 : margin <= 7 ? 1.3 : margin <= 14 ? 0.5 : 0)
    + (ot ? 1 : 0) + Math.min(1.5, big * 0.2) + Math.min(1.2, -worst / 7 * 0.6) + (late ? 1 : 0) + Math.min(0.8, pts / 50);
  return Math.max(1, Math.min(10, Math.round(score * 10) / 10));
}

// =================== player performance rating (separate from play rating) ===================
// points: production like a fantasy score; rating = 0.12 * points + 0.5 * (share of play value + big-moment boosts)
function points(p) { const s = p.stats || {};
  let v = (s.PYds || 0) * 0.04 + (s.PTD || 0) * 4 - (s.Int || 0) * 2 + (s.RushYds || 0) * 0.1 + (s.RushTD || 0) * 6
    + (s.RecYds || 0) * 0.1 + (s.RecTD || 0) * 6 + (s.Rec || 0) * 0.5 + (s.Tkl || 0) + (s.Sack || 0) * 3 + (s.DInt || 0) * 4 + (s.PBU || 0) * 1.5;
  if (p.slot === "LG" || p.slot === "RG") v += (s.Snaps || 0) * 0.25 - (s.SackAlw || 0) * 2 + (s.TeamRush || 0) * 0.03;
  return v; }
function buildPerf(asc, players, tags) {
  const ptsQ = {}, boostQ = {}, boostAll = {};
  const add = (map, k, q, v) => { if (!k) return; map[k] = map[k] || {}; map[k][q] = (map[k][q] || 0) + v; };
  for (const p of asc) {
    const q = "Q" + Math.min(p.q, 5), title = p.title || "", pr = p.primary?.key, se = p.secondary?.key, g = p.gain || 0;
    if (p.pass && /catch|bomb/.test(title)) { add(ptsQ, pr, q, g * 0.1 + 0.5 + (p.td ? 6 : 0)); add(ptsQ, se, q, g * 0.04 + (p.td ? 4 : 0)); }
    else if (/Interception|Pick-six/.test(title)) { add(ptsQ, pr, q, 4 + (p.kind === "td" ? 6 : 0)); add(ptsQ, se, q, -2); }
    else if (/broken up/.test(title)) add(ptsQ, se, q, 1.5);
    else if (p.sack) add(ptsQ, pr, q, 3);
    else if (p.rush) { add(ptsQ, pr, q, g * 0.1 + (p.td ? 6 : 0)); add(ptsQ, se, q, 1); }
    const b = boostOf(tags[p.n]);
    if (b && !p.turnover) {
      if (p.primary && p.primary.team === p.off) { add(boostQ, pr, q, b * 0.6); boostAll[pr] = (boostAll[pr] || 0) + b * 0.6; }
      if (p.secondary && p.secondary.team === p.off) { add(boostQ, se, q, b * 0.4); boostAll[se] = (boostAll[se] || 0) + b * 0.4; }
    }
  }
  const perf = {};
  for (const [k, pl] of Object.entries(players)) {
    const pts = points(pl), rtg = 0.12 * pts + 0.5 * ((pl.rating || 0) + (boostAll[k] || 0));
    const byQ = {};
    for (const q of ["Q1", "Q2", "Q3", "Q4", "Q5"]) {
      const v = 0.12 * (ptsQ[k]?.[q] || 0) + 0.5 * ((pl.byQ?.[q] || 0) + (boostQ[k]?.[q] || 0));
      if (v || pl.byQ?.[q] != null || ptsQ[k]?.[q] != null) byQ[q] = v;
    }
    perf[k] = { pts, rtg, byQ };
  }
  return perf;
}

// =================== games grid ===================
let listFilter = "all", cache = { index: {}, views: {}, ratings: {} };
const rated = new Set();
function showGames() {
  stopAll();
  topbar.innerHTML = `<a class="brand" href="#/">Gridiron <b>Legends</b></a>`;
  const draw = () => {
    let games = Object.entries(cache.index || {}).map(([id, g]) => ({ id, ...g })).sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
    if (listFilter === "live") games = games.filter(g => isLive(g));

function teamStats(asc, players, flags) {
  const blank = () => ({ yds: 0, pass: 0, rush: 0, rushAtt: 0, passAtt: 0, top: 0, fd: 0, a3: 0, c3: 0, a4: 0, c4: 0, rzT: 0, rzTD: 0, to: 0,

  const S = { Home: blank(), Away: blank() }, other = s => s === "Home" ? "Away" : "Home";
  for (const p of Object.values(players)) { const s = p.stats || {}, T = S[p.team]; if (!T) continue;
    T.pass += s.PYds || 0; T.rush += s.RushYds || 0; T.rushAtt += s.Car || 0; T.passAtt += s.Att || 0; T.to += s.Int || 0;
    T.sacks += s.Sack || 0; T.ints += s.DInt || 0; T.pd += (s.PBU || 0) + (s.DInt || 0); }

  const closeDrive = () => { if (drive && drive.rz) { S[drive.off].rzT++; if (drive.td) S[drive.off].rzTD++; } };
  for (const p of asc) {
    const T = S[p.off]; if (!T) continue;
    const snap = p.rush || p.pass || p.sack, now = secs(p.clock), was = prev && prev.q === p.q ? secs(prev.clock) : 240;
    if (was >= now) T.top += was - now;
    if (snap && p.fd) T.fd++;
    if (snap && p.down === 3) { T.a3++; if (p.fd) T.c3++; }
    if (snap && p.down === 4) { T.a4++; if (p.fd) T.c4++; }
    if (p.rush && p.gain < 0) S[other(p.off)].tfl++;
    if (p.turnover && p.kind === "td") S[other(p.off)].defTD++;
    if (p.kind === "safety") S[other(p.off)].safeties++;
    if (p.kind === "fg" || p.kind === "fgmiss") { T.fga++; if (p.kind === "fg") T.fgm++; }

  for (const k of ["Home", "Away"]) S[k].yds = S[k].pass + S[k].rush;
  return S;
}

function showGame(id, tab = "feed", sub = null) {

    const T = s => s === "Home" ? m.home : m.away;

}

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rating by quarter"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--rule)"/>
    ${vals.map((v, i) => { const h = Math.abs(v) / mx * 70, x = i * bw + bw * 0.12, w = bw * 0.76;
      return `<rect x="${x}" y="${v >= 0 ? mid - h : mid}" width="${w}" height="${Math.max(2, h)}" rx="3" fill="${v >= 0 ? "var(--gold)" : "var(--flag)"}"/>
      <text x="${x + w / 2}" y="${v >= 0 ? mid - h - 8 : mid + h + 18}" text-anchor="middle" fill="var(--ink)" font-family="Barlow Condensed" font-weight="700" font-size="18">${v.toFixed(2)}</text>
      <text x="${x + w / 2}" y="${H - 4}" text-anchor="middle" fill="var(--mute)" font-family="Barlow" font-size="14">${qs[i] === "Q5" ? "OT" : qs[i]}</text>`; }).join("")}</svg>`;
}
function perfStrip(ctx, list, activeKey) {
  const { id, m, T, perf } = ctx;
  const teamAv = side => { const t = side === "Home" ? m.home : m.away, r = teamRating(ctx, side);
    return `<a class="av team ${activeKey === "team:" + side ? "on" : ""}" href="#/game/${esc(id)}/team/${side}" title="${esc(t?.name)} team performance">${badge(t)}<em class="${cls(r)}">${one(r)}</em></a>`; };
  return `<div class="avstrip">${teamAv("Away")}${teamAv("Home")}<span class="avsep"></span>${list.map(([k, x]) => `<a class="av ${k === activeKey ? "on" : ""}" href="#/game/${esc(id)}/perf/${esc(k)}" title="${esc(x.name)}">${avatar(x.name, T(x.team))}<em class="${cls(perf[k].rtg)}">${one(perf[k].rtg)}</em></a>`).join("")}</div>`;
}
function perfList(ctx) { return Object.entries(ctx.players).filter(([, p]) => Object.keys(p.stats || {}).some(k => k !== "Snaps") || p.rating).sort((a, b) => ctx.perf[b[0]].rtg - ctx.perf[a[0]].rtg); }
function perfTab(ctx, pkey) {
  const { players, desc, T, perf } = ctx, list = perfList(ctx);
  if (!list.length) return perfStrip(ctx, [], null) + `<div class="empty"><strong>No performances yet</strong>Ratings appear as soon as players make plays.</div>`;
  const key = pkey && players[pkey] ? pkey : list[0][0], p = players[key], team = T(p.team), s = p.stats || {}, pf = perf[key];
  const mine = desc.filter(pl => (pl.players && pl.players[key] != null) || pl.primary?.key === key || pl.secondary?.key === key)
    .sort((a, b) => Math.abs(b.players?.[key] || 0) - Math.abs(a.players?.[key] || 0)).slice(0, 8);
  const headline = s.Att ? `${s.PYds || 0}<small>pyds</small>${s.PTD || 0}<small>ptd</small>${s.Int || 0}<small>int</small>`
    : s.Car ? `${s.RushYds || 0}<small>yds</small>${s.RushTD || 0}<small>td</small>${s.Rec || 0}<small>rec</small>`
    : (s.Rec || s.Tgt) ? `${s.RecYds || 0}<small>yds</small>${s.Rec || 0}<small>rec</small>${s.RecTD || 0}<small>td</small>`
    : `${s.Tkl || 0}<small>tkl</small>${s.Sack || 0}<small>sack</small>${s.DInt || 0}<small>int</small>`;
  return perfStrip(ctx, list, key) + `
    <section class="hero">${avatar(p.name, team)}<div><div class="nm">${esc(p.name)} · ${esc(posOf(p))} · ${one(pf.pts)} pts</div><div class="big">${headline}</div></div>
      <div class="rt ${cls(pf.rtg)}">${one(pf.rtg)}<small>Performance rating</small></div></section>
    ${statGrid(p, pf)}<h2>Rating breakdown</h2>${quarterChart(pf.byQ)}
    <h2>Plays</h2>${mine.length ? mine.map(pl => playRow(pl, ctx, pl.players?.[key] ?? shownValue(pl, ctx.tags[pl.n]))).join("") : `<div class="empty">No plays yet.</div>`}`;
}
// team performance: team rating, stats, rating by quarter (value gained on offense minus value allowed on defense), top performers, best plays
function teamPerf(ctx, side) {
  const { id, m, players, perf, asc, flags, tags } = ctx, t = side === "Home" ? m.home : m.away;
  const S = teamStats(asc, players, flags)[side], tr = teamRating(ctx, side), us = side === "Home" ? m.homeScore : m.awayScore, them = side === "Home" ? m.awayScore : m.homeScore;
  const forUs = p => (p.off === side ? 1 : -1) * shownValue(p, tags[p.n]);
  const byQ = {};
  for (const p of asc) { const q = "Q" + Math.min(p.q, 5); byQ[q] = (byQ[q] || 0) + forUs(p); }
  const best = [...asc].sort((a, b) => forUs(b) - forUs(a)).slice(0, 6).filter(p => forUs(p) > 0);
  const tops = Object.entries(players).filter(([, p]) => p.team === side).sort((a, b) => perf[b[0]].rtg - perf[a[0]].rtg).slice(0, 4);
  const result = !isLive(m) ? (us > them ? "Win" : us < them ? "Loss" : "Tie") : "Live";
  return perfStrip(ctx, perfList(ctx), "team:" + side) + `
    <section class="hero">${badge(t, "lg")}<div><div class="nm">${esc(t?.city)} ${esc(t?.name)} · ${result} ${us ?? 0}–${them ?? 0}</div>
      <div class="big">${S.yds}<small>yds</small>${S.pass}<small>pyds</small>${S.rush}<small>ruyds</small></div></div>
      <div class="rt ${cls(tr)}">${one(tr)}<small>Team rating</small></div></section>
    ${teamStrip(S)}
    <h2>Rating breakdown</h2>${quarterChart(byQ)}
    <h2>Top performers</h2>${tops.map(([k, p]) => `<div class="prow"><a href="#/game/${esc(id)}/perf/${esc(k)}">${avatar(p.name, t)}</a>
      <div><div class="nm"><a href="#/game/${esc(id)}/perf/${esc(k)}">${esc(p.name)}</a> <span>${esc(posOf(p))}</span><em class="${cls(perf[k].rtg)}">${one(perf[k].rtg)}</em></div>
      <div style="color:var(--mute);font-size:13px">${esc(p.line || "")}</div></div></div>`).join("")}
    <h2>Best plays</h2>${best.length ? best.map(p => playRow(p, ctx, forUs(p))).join("") : `<div class="empty">No big plays yet.</div>`}`;
}

// =================== router ===================
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  if (parts[0] === "game" && parts[1]) showGame(parts[1], parts[2] || "feed", parts[3] || null);
  else showGames();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
